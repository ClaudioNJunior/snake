    body {

    #content{
      max-width: 100vw;
    }

    #canvas-frame {
      --frame-width: 4px;
      position: relative;
      width: max-content;
      margin: 0 auto;
    }

    #canvas-frame::after {
      /* Paint all four edges above the bitmap, independently of native dashed
         canvas borders (which can lose vertical edges on mobile WebKit). */
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(to right, #674e0d 0 calc(var(--frame-width) * 3), transparent calc(var(--frame-width) * 3) calc(var(--frame-width) * 6)),
        repeating-linear-gradient(to right, #674e0d 0 calc(var(--frame-width) * 3), transparent calc(var(--frame-width) * 3) calc(var(--frame-width) * 6)),
        repeating-linear-gradient(to bottom, #674e0d 0 calc(var(--frame-width) * 3), transparent calc(var(--frame-width) * 3) calc(var(--frame-width) * 6)),
        repeating-linear-gradient(to bottom, #674e0d 0 calc(var(--frame-width) * 3), transparent calc(var(--frame-width) * 3) calc(var(--frame-width) * 6));
      background-size: 100% var(--frame-width), 100% var(--frame-width), var(--frame-width) 100%, var(--frame-width) 100%;
      background-position: left top, left bottom, left top, right top;
      background-repeat: no-repeat;
    }

    #canvas {
      /* The bitmap stays 528 x 288. Only its CSS display size changes. */
      box-sizing: border-box;
      display: block;
      width: 504px;
      height: 338px;
      margin: 0 auto;
      /* Reserve exactly the same space; the overlay paints the visible frame. */
      border: 4px solid transparent;

<body>
  <div id="content">
    <h1 class="game-title">SNAKE GAME</h1>
    <h1 style="margin: 0;">Difficulty</h1>
    <p id="difficulty-choices" style="margin-top: 0">
      <button type="button" id="spnDif1" class="difficulty-control" data-game-action="difficulty" data-difficulty="1">[1] Easy</button>
      <br />
      <button type="button" id="spnDif2" class="difficulty-control selected" data-game-action="difficulty" data-difficulty="2">[2] Medium</button>
      <br />
      <button type="button" id="spnDif3" class="difficulty-control" data-game-action="difficulty" data-difficulty="3">[3] Hard</button>
      <br />
      <button type="button" id="spnDif4" class="difficulty-control" data-game-action="difficulty" data-difficulty="4">[4] Impossible</button>
      <br />
      <button type="button" id="spnDif5" class="difficulty-control" data-game-action="difficulty" data-difficulty="5">[5] GODMODE</button>
    </p>
    <div id="canvas-frame">
      <canvas id="canvas" width="528" height="288" aria-label="Snake game board"></canvas>
    </div>
    <p id="pPontuacao">0/0</p>
    <p id="pTime">00:00</p>
    <p><button type="button" class="game-control" data-game-action="restart">Press [R] to Restart or Try Again</button></p>
    <p><button type="button" id="pause-control" class="game-control" data-game-action="pause" aria-pressed="false">Press [Space] or [P] to Pause</button></p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const cols = 22;
    const rows = 12;
    const cellSize = 24;

    let intervalDif = [215, 115, 80, 50, 30];
    let dif = 2;
    let interval = intervalDif[dif - 1];
    let nextDif = 2;
    let time = 0;

    let collisionCount = 0;
    let perdeu = false;
    let venceu = false;
    let moveTimer = null;
    let moving = false;
    let paused = false;

    let dir = 'right';

    function getDefaultSnake() {
      var defSnake = [];

      for (var i = 8; i >= 0; i--) {
        defSnake.push({ x: i, y: 10 });
      }

      return defSnake;
    }

    let snake = getDefaultSnake();

    let fruit = generateFruit();
    let alreadyCommanded = false;
    let nextCommand = "";

    // No backing-buffer resizing during zoom or viewport changes.
    ctx.imageSmoothingEnabled = false; // Keep this disabled for any future drawImage().

    function fitDisplayGrid(widthLimit, heightLimit) {
      // Each original tile is made from repeating 6px blocks (24 / 4).
      // Fit those blocks, not the outer frame, to whole physical screen pixels.
      const blockSize = cellSize / 4;
      const columns = canvas.width / blockSize;
      const rows = canvas.height / blockSize;
      const originalAspect = (504 - 8) / (338 - 8);
      const maxX = Math.max(1, Math.floor(widthLimit / columns));
      const maxY = Math.max(2, Math.floor(heightLimit / rows));
      let best = null;

      for (let x = 1; x <= maxX; x++) {
        // Keep the intentionally taller pixels instead of forcing square ones.
        for (let y = x + 1; y <= maxY; y++) {
          const width = columns * x;
          const height = rows * y;
          const error = Math.abs(width / height / originalAspect - 1);
          const area = width * height;
          const close = error <= 0.02;
          if (!best || (close && !best.close) ||
              (close && best.close && area > best.area) ||
              (!close && !best.close && (error < best.error - 1e-9 ||
                (Math.abs(error - best.error) < 1e-9 && area > best.area)))) {
            best = { width, height, error, area, close };
          }
        }
      }
      return best;
    }

    function resizeCanvasDisplay() {
      const ratio = window.devicePixelRatio || 1;
      const availableWidth = Math.max(1, document.documentElement.clientWidth - 16);
      const content = document.getElementById('content');
      const otherHeight = content.getBoundingClientRect().height - canvas.getBoundingClientRect().height;
      const availableHeight = Math.max(338 / ratio, window.innerHeight - otherHeight - 16);
      const fit = Math.min(availableWidth * ratio / 504, availableHeight * ratio / 338);
      const scale = fit < 1 ? fit : Math.min(4, Math.floor(fit));
      const border = Math.max(1, Math.round(4 * scale));
      const grid = fitDisplayGrid(504 * scale - 2 * border, 338 * scale - 2 * border);
      canvas.style.width = `${(grid.width + 2 * border) / ratio}px`;
      canvas.style.height = `${(grid.height + 2 * border) / ratio}px`;
      canvas.style.borderWidth = `${border / ratio}px`;
      const frame = document.getElementById('canvas-frame');
      frame.style.setProperty('--frame-width', `${border / ratio}px`);

      // Align the frame and its canvas together, including after rotation.
      frame.style.transform = 'none';
      const rect = frame.getBoundingClientRect();
      const offsetX = (Math.round(rect.left * ratio) - rect.left * ratio) / ratio;
      const offsetY = (Math.round(rect.top * ratio) - rect.top * ratio) / ratio;
      frame.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }

    window.addEventListener('resize', resizeCanvasDisplay);
    window.visualViewport?.addEventListener('resize', resizeCanvasDisplay);

    let minLength = getDefaultSnake().length;
    let maxScore = cols * rows - minLength;

    function startGame(firstDirection) {
      stopMoving();
      stopCounting();
      moving = false;
      snake = getDefaultSnake();
      fruit = generateFruit();
      perdeu = false;
      venceu = false;
      paused = false;
      dir = "right";
      collisionCount = 0;
      alreadyCommanded = false;
      nextCommand = "";

      document.getElementById(`spnDif${dif}`).classList.remove('selected');
      dif = nextDif;
      interval = intervalDif[dif - 1];
      document.querySelectorAll('.predicted').forEach(el => {
        el.classList.remove('predicted');
      });
      document.getElementById(`spnDif${dif}`).classList.add('selected');

      document.getElementById("pTime").textContent = "00:00";

      time = 0;
      if (firstDirection) processCommand(firstDirection);

      startMoving();
      startCounting();
    }

    function isPlaying() {
      return moving && !paused && !perdeu && !venceu;
    }

    function syncControls() {
      document.documentElement.classList.toggle('is-playing', isPlaying());
      const pauseButton = document.getElementById('pause-control');
      pauseButton.textContent = `Press [Space] or [P] to ${paused ? 'Resume' : 'Pause'}`;
      pauseButton.setAttribute('aria-pressed', String(paused));
    }

    function stopMoving() {
      if (moveTimer !== null) {
        clearTimeout(moveTimer);
        moveTimer = null;
      }
    }

    function togglePause() {
      if (perdeu || venceu) return;
      paused = !paused;
      alreadyCommanded = false;
      nextCommand = '';
      if (paused) {
        stopMoving();
        stopCounting();
        drawGrid();
        drawSnake();
        drawFruit();
        drawPaused();
        syncControls();
      } else {
        startMoving();
        startCounting();
      }
    }

    function selectDifficulty(value) {
      nextDif = Number(value);
      document.querySelectorAll('.predicted').forEach(el => el.classList.remove('predicted'));
      document.getElementById(`spnDif${nextDif}`).classList.add('predicted');
    }

    function sendDirection(key) {
      if (paused || perdeu || venceu) return;
      if (!moving) {
        startGame(key);
      } else if (alreadyCommanded) {
        nextCommand = key;
      } else {
        alreadyCommanded = true;
        processCommand(key);
      }
    }

    function runControl(button) {
      switch (button.dataset.gameAction) {
        case 'restart': startGame(); break;
        case 'pause': togglePause(); break;
        case 'difficulty': selectDifficulty(button.dataset.difficulty); break;
      }
    }

    const directionKeys = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'a', 'A', 's', 'S', 'd', 'D']);
    const scrollKeys = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'PageUp', 'PageDown', 'Home', 'End']);
    document.addEventListener('keydown', e => {
      const button = e.target.closest?.('button');
      // Let native button activation handle Enter/Space once, without also pausing.
      if (button && (e.key === 'Enter' || e.key === ' ')) {
        if (e.repeat) e.preventDefault();
        return;
      }
      if (isPlaying() && scrollKeys.has(e.key)) e.preventDefault();
      if (directionKeys.has(e.key)) {
        if (!paused && !perdeu && !venceu) e.preventDefault();
        sendDirection(e.key);
      } else if (/^[rRpP ]$/.test(e.key)) {
        e.preventDefault();
        if (e.repeat) return;
        if (e.key.toLowerCase() === 'r') startGame();
        else togglePause();
      } else if (/^[1-5]$/.test(e.key)) {
        selectDifficulty(e.key);
      } else if (!moving && !paused && !perdeu && !venceu && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
        startGame();
      }
    });

    document.addEventListener('wheel', e => {
      if (isPlaying()) e.preventDefault();
    }, { passive: false });

    // Pointer tracking suppresses clicks from a mouse/pen drag, not just touch.
    const tapSlop = 10;
    const swipeDistance = 24;
    let pointerStart = null;
    let suppressPointerClick = false;
    document.addEventListener('pointerdown', e => {
      suppressPointerClick = false;
      pointerStart = { id: e.pointerId, x: e.clientX, y: e.clientY };
    }, true);
    function trackPointer(e) {
      if (pointerStart?.id !== e.pointerId) return;
      if (Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y) > tapSlop) suppressPointerClick = true;
    }
    document.addEventListener('pointermove', trackPointer, true);
    document.addEventListener('pointerup', e => {
      trackPointer(e);
      pointerStart = null;
    }, true);
    document.addEventListener('pointercancel', () => { pointerStart = null; suppressPointerClick = true; }, true);
    document.addEventListener('click', e => {
      if (suppressPointerClick && e.detail !== 0) {
        e.preventDefault();
        e.stopImmediatePropagation();
        return;
      }
      const button = e.target.closest?.('[data-game-action]');
      if (button) runControl(button);
    });

    // Touch Events allow whole-page swipes and explicit non-passive scroll control.
    let gesture = null;
    document.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) {
        gesture = null;
        if (isPlaying()) e.preventDefault();
        return;
      }
      const touch = e.touches[0];
      gesture = { id: touch.identifier, x: touch.clientX, y: touch.clientY, originX: touch.clientX, originY: touch.clientY, dragged: false, button: e.target.closest?.('[data-game-action]') };
      if (isPlaying()) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchmove', e => {
      // Cancel the first move too, so an initial swipe can start the game
      // before the browser claims the gesture for scrolling.
      if (isPlaying() || (gesture && !moving && !paused && !perdeu && !venceu)) e.preventDefault();
      if (!gesture || e.touches.length !== 1) return;
      const touch = [...e.touches].find(t => t.identifier === gesture.id);
      if (!touch) return;
      if (Math.hypot(touch.clientX - gesture.originX, touch.clientY - gesture.originY) > tapSlop) gesture.dragged = true;
      if (paused || perdeu || venceu) return;
      const dx = touch.clientX - gesture.x;
      const dy = touch.clientY - gesture.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < swipeDistance) return;
      e.preventDefault();
      sendDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
      gesture.x = touch.clientX;
      gesture.y = touch.clientY;
    }, { passive: false });
    document.addEventListener('touchend', e => {
      if (!gesture) return;
      const touch = [...e.changedTouches].find(t => t.identifier === gesture.id);
      if (!touch) return;
      const finished = gesture;
      gesture = null;
      const dragged = finished.dragged || Math.hypot(touch.clientX - finished.originX, touch.clientY - finished.originY) > tapSlop;
      if (dragged || finished.button || isPlaying()) {
        e.preventDefault();
        suppressPointerClick = true;
      }
      if (!dragged && finished.button) runControl(finished.button);
    }, { passive: false });
    document.addEventListener('touchcancel', () => { gesture = null; suppressPointerClick = true; });


    function drawGrid() {
      ctx.fillStyle = '#c0cc00';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < cols; i++) {
        for (var j = 0; j < rows; j++) {
          generateFullTile(i, j);
        }
      }
    }

    function drawSnake() {
      // Tipos de partes:
      // Curvas:
      // - Bottom right
      // - Bottom left
      // - Top right
      // - Top left
      // Meios:
      // - Vertical
      // - Horizontal
      // Final:
      // - Top
      // - Right
      // - Bottom
      // - Left

      for (var i = 0; i < snake.length; i++) {
        const col = snake[i].x;
        const row = snake[i].y;

        let top = false, right = false, bottom = false, left = false;

        if (i == 0 || i == snake.length - 1) {
          // Final
          let opcao = "";
          if (0 == snake.length - 1) {
            opcao = dir;
          }
          else if (i == 0) {
            if (snake[i].x > snake[i + 1].x) {
              opcao = "right";
              left = true;
            }
            else if (snake[i].x < snake[i + 1].x) {
              opcao = "left";
              right = true;
            }
            else if (snake[i].y > snake[i + 1].y) {
              opcao = "bottom";
              top = true;
            }
            else if (snake[i].y < snake[i + 1].y) {
              opcao = "top";
              bottom = true;
            }
          }
          else {
            if (snake[i].x > snake[i - 1].x) {
              opcao = "right";
              left = true;
            }
            else if (snake[i].x < snake[i - 1].x) {
              opcao = "left";
              right = true;
            }
            else if (snake[i].y > snake[i - 1].y) {
              opcao = "bottom";
              top = true;
            }
            else if (snake[i].y < snake[i - 1].y) {
              opcao = "top";
              bottom = true;
            }
          }
        }
        else if (i > 0 && i < snake.length - 1) {
          // Meio ou curva
          if (snake[i - 1].x == snake[i + 1].x) {
            // Meio (vertical)
            top = true;
            bottom = true;
          }
          else if (snake[i - 1].y == snake[i + 1].y) {
            // Meio (horizontal)
            right = true;
            left = true;
          }
          else {
            // Curva

            if (snake[i - 1].x > snake[i + 1].x && snake[i - 1].y > snake[i + 1].y) {
              if (snake[i - 1].x === snake[i].x) {
                bottom = true;
                left = true;
              } else {
                top = true;
                right = true;
              }
            } else if (snake[i - 1].x > snake[i + 1].x && snake[i - 1].y < snake[i + 1].y) {
              if (snake[i - 1].x === snake[i].x) {
                top = true;
                left = true;
              } else {
                bottom = true;
                right = true;
              }
            } else if (snake[i - 1].x < snake[i + 1].x && snake[i - 1].y > snake[i + 1].y) {
              if (snake[i - 1].x === snake[i].x) {
                bottom = true;
                right = true;
              } else {
                top = true;
                left = true;
              }
            } else if (snake[i - 1].x < snake[i + 1].x && snake[i - 1].y < snake[i + 1].y) {
              if (snake[i - 1].x === snake[i].x) {
                top = true;
                right = true;
              } else {
                bottom = true;
                left = true;
              }
            }
          }
        }

        generateCommonPart(col, row);
        if (top) generateTopPart(col, row);
        if (bottom) generateBottomPart(col, row);
        if (right) generateRightPart(col, row);
        if (left) generateLeftPart(col, row);
      }
    }

    function generateFullTile(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;
      ctx.fillStyle = '#674e0d23';

      // canto superior esquerdo
      ctx.fillRect(
        col * cellSize,
        row * cellSize,
        partSize / 2 - margin,
        partSize / 2 - margin
      );
      // topo meio 1
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // topo meio 2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // topo meio 3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // canto superior direito
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize,
        partSize / 2 - margin,
        partSize / 2 - margin
      );

      // esquerda meio 1
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      // centro C1R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C2R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C3R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // direita meio 1
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );

      // esquerda meio 2
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      // centro C1R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C2R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C3R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // direita meio 2
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );

      // esquerda meio 3
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      // centro C1R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C2R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // centro C3R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // direita meio 3
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );

      // canto inferior esquerdo
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize * 3.5 + margin,
        partSize / 2 - margin,
        partSize / 2 - margin
      );
      // baixo meio 1
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // baixo meio 2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // baixo meio 3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      // canto inferior direito
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize / 2 - margin,
        partSize / 2 - margin
      );
    }

    function generateTopPart(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize,
        partSize - margin * 2,
        partSize / 2 - margin
      );
    }

    function generateRightPart(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';

      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      ctx.fillRect(
        col * cellSize + partSize * 3.5 + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
    }

    function generateLeftPart(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';

      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
      ctx.fillRect(
        col * cellSize,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize / 2 - margin,
        partSize - margin * 2
      );
    }

    function generateBottomPart(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize * 3.5 + margin,
        partSize - margin * 2,
        partSize / 2 - margin
      );
    }

    function generateCommonPart(col, row) {
      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';
      // C1R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C2R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C3R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C1R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C2R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C3R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C1R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C2R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C3R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
    }

    function drawFruit() {
      const col = fruit.x;
      const row = fruit.y;

      let margin = 1;
      let partSize = cellSize / 4;

      ctx.fillStyle = '#674e0d';
      // C2R1
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C1R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C3R2
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + partSize + margin,
        row * cellSize + partSize / 2 + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
      // C2R3
      ctx.fillRect(
        col * cellSize + partSize / 2 + partSize + margin,
        row * cellSize + partSize / 2 + partSize + partSize + margin,
        partSize - margin * 2,
        partSize - margin * 2
      );
    }

    function processCommand(key) {
      switch (key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dir != 'bottom') dir = 'top';
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dir != 'left') dir = 'right';
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dir != 'right') dir = 'left';
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dir != 'top') dir = 'bottom';
          break;
      }
    }

    function generateFruit() {
      let blocked = true;

      if (snake.length == cols * rows) {
        venceu = true;
        return;
      }
      while (blocked) {
        var newFruit = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
        blocked = false;
        for (var i = 0; i < snake.length; i++) {
          if (newFruit.x == snake[i].x && newFruit.y == snake[i].y) {
            blocked = true;
          }
        }
      }

      return newFruit;
    }

    function moveSnake() {
      if (nextCommand != "" && alreadyCommanded == false) {
        processCommand(nextCommand);
        nextCommand = "";
      }

      let startingHeadPos = { x: snake[0].x, y: snake[0].y };
      let lastPart = { y: snake[snake.length - 1].y, x: snake[snake.length - 1].x }

      switch (dir.toLowerCase()) {
        case 'top':
          snake[0].y = snake[0].y - 1;
          break;
        case 'right':
          snake[0].x = snake[0].x + 1;
          break;
        case 'bottom':
          snake[0].y = snake[0].y + 1;
          break;
        case 'left':
          snake[0].x = snake[0].x - 1;
          break;
      }

      let headPos = { x: snake[0].x, y: snake[0].y }

      checkPreventCollision(headPos, startingHeadPos);

      var moved = startingHeadPos.x != snake[0].x || startingHeadPos.y != snake[0].y

      if (snake.length > 1 && moved) {
        let posAnterior = { x: startingHeadPos.x, y: startingHeadPos.y }
        for (var i = 0; i < snake.length; i++) {
          var pos = i + 1;

          if (pos == snake.length) {
            continue;
          }

          let posTemp = { x: snake[pos].x, y: snake[pos].y };

          snake[pos].x = posAnterior.x;
          snake[pos].y = posAnterior.y;

          posAnterior = posTemp;
        }
      }

      checkEatFruit(lastPart);
    }

    function checkEatFruit(lastPart) {
      if (snake[0].y == fruit.y && snake[0].x == fruit.x) {
        snake.push(lastPart);
        fruit = generateFruit();
      }
    }

    function checkPreventCollision(headPos, startingHeadPos) {
      let bateu = false;

      if (headPos.x < 0) {
        snake[0].x = 0;
        bateu = true;
      }

      if (headPos.x > cols - 1) {
        snake[0].x = cols - 1;
        bateu = true;
      }

      if (headPos.y < 0) {
        snake[0].y = 0;
        bateu = true;
      }

      if (headPos.y > rows - 1) {
        snake[0].y = rows - 1;
        bateu = true;
      }

      if (snake.length > 1) {
        for (var i = 1; i < snake.length - 1; i++) {
          if (headPos.x == snake[i].x && headPos.y == snake[i].y) {
            snake[0].x = startingHeadPos.x;
            snake[0].y = startingHeadPos.y;
            bateu = true;
          }
        }
      }

      if (bateu)
        collisionCount++;
      else
        collisionCount = 0;
    }

    function drawCenteredText(text, size = 54) {
      ctx.font = `${size}px Bytesized`;
      ctx.fillStyle = '#674e0d';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
      );
    }

    function drawCenteredBottomText(text) {
      ctx.font = '30px Bytesized';
      ctx.fillStyle = '#674e0d'; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle'; 

      ctx.fillText(
        text,
        canvas.width / 2,
        canvas.height / 1.5 
      );
    }

    function showPoints() {
      let points = snake.length - minLength;
      document.getElementById("pPontuacao").textContent = `${points}/${maxScore}`;
    }

    function drawGameOver() {
      ctx.fillStyle = '#c0cc00b3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText('GAME OVER');
      drawCenteredBottomText(`Best Score: ${localStorage.getItem("maxScore")}`);
    }

    function drawStartScreen() {
      ctx.fillStyle = '#c0cc00b3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText('Press any key or swipe to start', 28);
    }

    function isFontLoaded(fontSpec) {
      return document.fonts.check(fontSpec);
    }

    function drawPaused() {
      ctx.fillStyle = '#c0cc00b3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText('PAUSED');
    }

    function drawWin() {
      ctx.fillStyle = '#c0cc00b3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenteredText('YOU WIN');
    }

    let countTimer = null;

    function startCounting() {
      if (countTimer !== null) return;

      const intervalMs = 100;

      function loop() {
        if (paused || !moving) {
          clearTimeout(countTimer);
          countTimer = null;
          return;
        }

        time += intervalMs;

        const seconds = Math.floor(time / 1000) % 60;
        const minutes = Math.floor(time / 60000);

        const strSeconds = `00${seconds}`.slice(-2);
        const strMinutes = `00${minutes}`.slice(-2);

        document.getElementById("pTime").textContent = `${strMinutes}:${strSeconds}`;

        countTimer = setTimeout(loop, intervalMs);
      }

      countTimer = setTimeout(loop, intervalMs);
    }

    function stopCounting() {
      if (countTimer !== null) {
        clearTimeout(countTimer);
        countTimer = null;
      }
    }

    function drawFirstFrame() {
      drawGrid();
      drawFruit();
      drawSnake();
      showPoints();
      drawStartScreen();
    }

    function startMoving() {
      stopMoving();
      if (paused || perdeu || venceu) {
        syncControls();
        return;
      }

      moving = true;
      syncControls();
      moveSnake();

      drawGrid();
      drawSnake();

      if (venceu) {
        moving = false;
        stopCounting();
        syncControls();
        drawWin();
        return;
      }

      drawFruit();

      alreadyCommanded = false;

      showPoints();

      if (collisionCount >= Math.ceil(3*intervalDif[1] / intervalDif[dif - 1])) {
        moving = false;
        perdeu = true;
        stopCounting();
        syncControls();

        const maxScore = localStorage.getItem("maxScore");
        if (maxScore < snake.length - minLength)
          localStorage.setItem("maxScore", snake.length - minLength);
        drawGameOver();
        return;
      }
      moveTimer = setTimeout(() => {
        moveTimer = null;
        startMoving();
      }, interval);
    }

    async function ensureFontLoaded() {
      await document.fonts.load('400 54px "Bytesized"');
      await document.fonts.ready;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await ensureFontLoaded();
      } catch (e) {
        console.warn('Fonte não carregou', e);
      }
      if (!moving && !paused && !perdeu && !venceu) drawFirstFrame();
      resizeCanvasDisplay();
    });

    syncControls();
    resizeCanvasDisplay();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isPlaying()) togglePause();
    });

    window.addEventListener('contextmenu', e => e.preventDefault());
  </script>
